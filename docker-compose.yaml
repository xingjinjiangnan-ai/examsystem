# 项目测试环境 compose
name: examsys-test
services:
  mysql:
    image: mysql:8.4
    container_name: examsys-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: examsys
      MYSQL_USER: examsys
      MYSQL_PASSWORD: examsys123
    volumes:
      - mysql-data-examsys:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data-examsys:
